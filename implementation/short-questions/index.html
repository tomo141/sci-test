const PILOT = {"version":"short-pilot-v1-20260917","items":[{"id":"short-math-01","originalFile":"math-analysis-logic-reviewed.json","originalKey":"10000000-0000-4000-8007-000000000328","change":"微分可能性の長い条件判定から、接線の傾きを求める一段の計算へ。測る内容も変わるため旧難度を継承しない。","question":"f(x)=x²の、x=3での接線の傾きは？","choices":["3","6","9","12"],"correctIndex":1,"explanation":"導関数はf′(x)=2x。x=3を代入すると、接線の傾きは6です。","distractorRationales":["xの値であり、傾きではありません。","導関数2xに3を代入した値です。","関数の値f(3)=9と、接線の傾きを区別します。","2xに3を代入しても12にはなりません。"],"sourceLocation":"OpenStax Calculus Volume 1 §3.2：導関数と接線の傾きの関係。計算は差商からも( (3+h)²−9 )/h→6と確認。","domain":"数学","subdomain":"解析・微分積分","content":{"question":"f(x)=x²の、x=3での接線の傾きは？","choices":["3","6","9","12"],"correctIndex":1,"explanation":"導関数はf′(x)=2x。x=3を代入すると、接線の傾きは6です。","distractorRationales":["xの値であり、傾きではありません。","導関数2xに3を代入した値です。","関数の値f(3)=9と、接線の傾きを区別します。","2xに3を代入しても12にはなりません。"],"sources":[{"title":"OpenStax — Calculus Volume 1 §3.2 The Derivative as a Function","url":"https://openstax.org/books/calculus-volume-1/pages/3-2-the-derivative-as-a-function"}]},"original":{"question":"開区間上の実数値関数 f が、その区間内の点 a で微分可能である。この仮定から必ずいえることはどれか。","choices":["fはaで連続である","f′(a)=0である","f′はaの近くのすべての点で存在する","fはaで2階微分可能である"],"correctIndex":0,"explanation":"1点aで微分可能なら、その点で連続である。f(x)−f(a)を差商とx−aの積で表して極限を取ると0になる。近くの点での微分可能性や2階微分可能性までは要求されない。","distractorRationales":["微分可能性から、その点での連続性が従う。","f(x)=xでは導関数は1。","たとえばf(x)=x²|sin(1/x)|（x≠0）、f(0)=0は0で微分可能だが、0へ近づく非零の零点付近に微分できない点がある。","f(x)=x|x|は0で微分可能だが、f′(x)=2|x|は0で微分可能でない。"],"sources":[{"title":"OpenStax — Calculus Volume 1 §3.2 The Derivative as a Function","url":"https://openstax.org/books/calculus-volume-1/pages/3-2-the-derivative-as-a-function"}]},"originalContentHash":"005d4eaf0b300a13ae7d44b5db033f69f1c38f6ac781052891de95d0ea9cfc32"},{"id":"short-physics-01","originalFile":"physics-classical-reviewed.json","originalKey":"10000000-0000-4000-8006-000000000151","change":"周波数変化の長い条件文を、現象名の識別に変更。","question":"近づく救急車のサイレンが高く聞こえる現象は？","choices":["共鳴","回折","ドップラー効果","干渉"],"correctIndex":2,"explanation":"音源が近づくと、観測者に届く波の間隔が詰まり、周波数が高くなります。","distractorRationales":["固有振動数に近い振動で振幅が増す現象です。","波が障害物の後ろなどへ回り込む現象です。","音源と観測者の相対運動による周波数の変化です。","波が重なり、強め合ったり弱め合ったりする現象です。"],"sourceLocation":"OpenStax University Physics Volume 1 §17.7：救急車のサイレンの例と、接近時の周波数変化。","domain":"物理","subdomain":"波動・光学・音響","content":{"question":"近づく救急車のサイレンが高く聞こえる現象は？","choices":["共鳴","回折","ドップラー効果","干渉"],"correctIndex":2,"explanation":"音源が近づくと、観測者に届く波の間隔が詰まり、周波数が高くなります。","distractorRationales":["固有振動数に近い振動で振幅が増す現象です。","波が障害物の後ろなどへ回り込む現象です。","音源と観測者の相対運動による周波数の変化です。","波が重なり、強め合ったり弱め合ったりする現象です。"],"sources":[{"title":"OpenStax — University Physics Volume 1, §17.7 The Doppler Effect","url":"https://openstax.org/books/university-physics-volume-1/pages/17-7-the-doppler-effect"}]},"original":{"question":"風のない空気中で、一定の周波数の音を出す音源が、空気に対して静止した観測者へ一直線に近づく。音源の速さは音速より小さい。観測される周波数は、音源が静止しているときに比べてどうなるか。","choices":["低くなる","変わらない","高くなる","必ず2倍になる"],"correctIndex":2,"explanation":"接近する音源の前方では波面の間隔が短くなり、観測者に到達する波の周波数が高くなる。","distractorRationales":["これは同じ条件で遠ざかる場合の変化。","音源と観測者が接近しているので変化する。","接近する音源によるドップラー効果。","増加の程度は音源の速さに依存し、常に2倍ではない。"],"sources":[{"title":"OpenStax — University Physics Volume 1, §17.7 The Doppler Effect","url":"https://openstax.org/books/university-physics-volume-1/pages/17-7-the-doppler-effect"}]},"originalContentHash":"5f9399034ac1ace17a9897f6d35c62802f22058111c979deb1451c6f12f8b53f"},{"id":"short-chemistry-01","originalFile":"chemistry-equilibria-reviewed.json","originalKey":"10000000-0000-4000-8007-000000000074","change":"誤答3肢の断定・限定表現を取り除き、性質から溶液名を答える問いへ。","question":"少量の酸・塩基によるpH変化を抑える溶液の呼び名は？","choices":["緩衝液","飽和溶液","過飽和溶液","懸濁液"],"correctIndex":0,"explanation":"緩衝液は、少量の酸や塩基によるpH変化を小さくします。抑えられる量には限りがあります。","distractorRationales":["pH変化を抑える性質を表す名称です。","溶解度に達した状態を表す名称です。","平衡での溶解度を超えて溶けた状態を表します。","粒子が液体中に分散した状態を表し、緩衝作用を意味しません。"],"sourceLocation":"OpenStax Chemistry 2e §14.6 冒頭：弱い共役酸塩基対と少量の酸・塩基に対するpH変化。","domain":"化学","subdomain":"酸塩基・酸化還元・電気化学","content":{"question":"少量の酸・塩基によるpH変化を抑える溶液の呼び名は？","choices":["緩衝液","飽和溶液","過飽和溶液","懸濁液"],"correctIndex":0,"explanation":"緩衝液は、少量の酸や塩基によるpH変化を小さくします。抑えられる量には限りがあります。","distractorRationales":["pH変化を抑える性質を表す名称です。","溶解度に達した状態を表す名称です。","平衡での溶解度を超えて溶けた状態を表します。","粒子が液体中に分散した状態を表し、緩衝作用を意味しません。"],"sources":[{"title":"OpenStax — Chemistry 2e, Buffers","url":"https://openstax.org/books/chemistry-2e/pages/14-6-buffers"}]},"original":{"question":"弱酸HAとその共役塩基A⁻が十分な量ずつある緩衝液の性質として適切なのはどれか。","choices":["pHは溶質の種類によらず必ず7になる","酸や塩基をどれほど加えてもpHは全く変わらない","緩衝能の範囲で少量の酸や塩基を加えたとき、pH変化を小さくできる","水の自己電離だけでpHが決まり、HAとA⁻の比は関係しない"],"correctIndex":2,"explanation":"加えた酸は主にA⁻、塩基は主にHAと反応するので、pHの変化が抑えられる。緩衝液にも容量があり、有限量の成分を使い切れば大きく変化する。","distractorRationales":["pHは酸の性質や成分比にも依存する。","緩衝作用には限界があり、変化が完全に0になるわけではない。","緩衝作用の範囲を含む説明。","共役酸塩基対の平衡と成分比が重要。"],"sources":[{"title":"OpenStax — Chemistry 2e, Buffers","url":"https://openstax.org/books/chemistry-2e/pages/14-6-buffers"}]},"originalContentHash":"cdcb8ed9123e204efff76ced989aef93c6f138d834739aedd049ec445114e719"},{"id":"short-biology-01","originalFile":"biology-foundations-reviewed.json","originalKey":"10000000-0000-4000-8007-000000000422","change":"輸送の長い説明を問題文へ集約し、関連する輸送様式の短い4択へ。","question":"エネルギーを使い、イオンを電気化学勾配に逆らって運ぶのは？","choices":["促進拡散","単純拡散","浸透","能動輸送"],"correctIndex":3,"explanation":"能動輸送は、別のエネルギー源と共役して、対象のイオンを電気化学勾配に逆らって運びます。","distractorRationales":["輸送タンパク質を介しますが、対象物質の勾配に従う受動輸送です。","対象物質の勾配に従う受動輸送です。","水の移動を扱う用語です。","ATPなどのエネルギーや、別の物質の勾配を利用できます。"],"sourceLocation":"OpenStax Biology 2e §5.3：電気化学勾配と一次・二次能動輸送。ATPの直接消費だけに限定しない。","domain":"生物","subdomain":"細胞生物学","content":{"question":"エネルギーを使い、イオンを電気化学勾配に逆らって運ぶのは？","choices":["促進拡散","単純拡散","浸透","能動輸送"],"correctIndex":3,"explanation":"能動輸送は、別のエネルギー源と共役して、対象のイオンを電気化学勾配に逆らって運びます。","distractorRationales":["輸送タンパク質を介しますが、対象物質の勾配に従う受動輸送です。","対象物質の勾配に従う受動輸送です。","水の移動を扱う用語です。","ATPなどのエネルギーや、別の物質の勾配を利用できます。"],"sources":[{"title":"OpenStax — Biology 2e, Active Transport","url":"https://openstax.org/books/biology-2e/pages/5-3-active-transport"}]},"original":{"question":"膜輸送体によるイオンの能動輸送を、受動輸送と区別する説明はどれか。","choices":["イオンが電気化学勾配に従うだけで移動する","別のエネルギー源と共役し、対象イオンを電気化学勾配に逆らって運ぶ","水分子だけが膜を通る","すべてのイオンが常に同じ向きへ拡散する"],"correctIndex":1,"explanation":"能動輸送は対象物質の逆勾配輸送をエネルギー供給と結びつける。ATP分解に直接共役する一次能動輸送と、別のイオンの勾配を利用する二次能動輸送がある。","distractorRationales":["受動輸送の駆動力である。","イオンの能動輸送を特徴づける。","イオンの能動輸送の説明ではない。","イオンの種類と勾配によって向きは変わる。"],"sources":[{"title":"OpenStax — Biology 2e, Active Transport","url":"https://openstax.org/books/biology-2e/pages/5-3-active-transport"}]},"originalContentHash":"03ec10c95b0ca8698129ea28eff67a5460aa345523345aa33297a4326e54a91a"},{"id":"short-earth-01","originalFile":"earth-weather-reviewed.json","originalKey":"earth-daytime-sea-breeze","change":"長い設定と、誤答の必ず北・必ず南を除去。風の名前を識別する短問へ。","question":"晴れた昼、海から陸へ吹く局地風は？","choices":["陸風","海風","山風","谷風"],"correctIndex":1,"explanation":"昼に陸が暖まると、海から陸へ空気が流れ込みます。これが海風です。","distractorRationales":["海陸風の循環で、陸から海へ吹く風です。","海から陸へ吹く風です。","山地から谷側へ吹く風を指します。","谷側から山地へ吹く風を指します。"],"sourceLocation":"NOAA NWS Wilmington, Science and Technology, Sea Breeze：陸の昇温と隣接する海からの空気の流入。","domain":"地学","subdomain":"気象・大気","content":{"question":"晴れた昼、海から陸へ吹く局地風は？","choices":["陸風","海風","山風","谷風"],"correctIndex":1,"explanation":"昼に陸が暖まると、海から陸へ空気が流れ込みます。これが海風です。","distractorRationales":["海陸風の循環で、陸から海へ吹く風です。","海から陸へ吹く風です。","山地から谷側へ吹く風を指します。","谷側から山地へ吹く風を指します。"],"sources":[{"title":"NOAA National Weather Service Wilmington — Science and Technology: Sea Breeze","url":"https://www.weather.gov/ilm/scienceandtechnology"}]},"original":{"question":"大規模な風が弱い晴れた昼間、陸が隣接する海より強く暖まり、海陸風の循環ができた。地表付近の海風はどちらへ吹くか。","choices":["陸から海へ","海から陸へ","海岸線に沿って必ず北へ","海岸線に沿って必ず南へ"],"correctIndex":1,"explanation":"陸側の加熱に伴う循環では、地表付近で海から陸へ海風が吹く。上空には戻りの流れがあり、大規模な風や地形によって実際の循環は変わる。","distractorRationales":["夜間などの陸風の向きと混同している。","指定した昼間の海風の向き。","緯度方向を常に北へ固定する関係ではない。","緯度方向を常に南へ固定する関係ではない。"],"sources":[{"title":"NOAA National Weather Service Wilmington — Science and Technology: Sea Breeze","url":"https://www.weather.gov/ilm/scienceandtechnology"}]},"originalContentHash":"32f4364c8595188c437de93930fd52336b68236c6d2b752eab2ceb3abc04ddc0"},{"id":"short-engineering-01","originalFile":"engineering-civil-reviewed.json","originalKey":"10000000-0000-4000-8007-000000000206","change":"共通する橋の説明を短くし、4肢を荷重の種類で統一。","question":"吊り橋の主ケーブルは、主にどの作用で荷重を支える？","choices":["圧縮","曲げ","引張","ねじり"],"correctIndex":2,"explanation":"主ケーブルは引張を受けて荷重を支えます。橋の塔が主に受ける圧縮と区別します。","distractorRationales":["ケーブルを押し縮める作用は主な荷重支持機構ではありません。","梁では重要ですが、柔軟な主ケーブルの主な支持機構とは異なります。","主ケーブルを引く力で荷重を伝えます。","主ケーブルの荷重支持を主に説明する作用ではありません。"],"sourceLocation":"FHWA IF-11-045：主ケーブルの引張強度・引張応力による耐荷力評価。","domain":"工学","subdomain":"土木・地盤・防災","content":{"question":"吊り橋の主ケーブルは、主にどの作用で荷重を支える？","choices":["圧縮","曲げ","引張","ねじり"],"correctIndex":2,"explanation":"主ケーブルは引張を受けて荷重を支えます。橋の塔が主に受ける圧縮と区別します。","distractorRationales":["ケーブルを押し縮める作用は主な荷重支持機構ではありません。","梁では重要ですが、柔軟な主ケーブルの主な支持機構とは異なります。","主ケーブルを引く力で荷重を伝えます。","主ケーブルの荷重支持を主に説明する作用ではありません。"],"sources":[{"title":"FHWA — Primer for the Inspection and Strength Evaluation of Suspension Bridge Cables","url":"https://www.fhwa.dot.gov/bridge/pubs/if11045.pdf"}]},"original":{"question":"通常の吊り橋で、橋桁から吊り材を介して荷重を受ける主ケーブルは、主にどのような力で荷重を支えるか。","choices":["曲げモーメントだけ","圧縮力","引張力","ねじりモーメントだけ"],"correctIndex":2,"explanation":"吊り材は橋桁の荷重を主ケーブルへ伝え、主ケーブルは張力を負担する。柔軟なケーブルを、剛な梁や圧縮柱と同じ仕組みで扱わない。","distractorRationales":["柔軟なケーブルは梁の曲げ剛性を主に使う部材ではない。","圧縮柱とは異なり、主に引張りで抵抗する。","主ケーブルに沿った張力で荷重を伝える。","主ケーブルの主要な荷重伝達の仕組みではない。"],"sources":[{"title":"FHWA — Primer for the Inspection and Strength Evaluation of Suspension Bridge Cables","url":"https://www.fhwa.dot.gov/bridge/pubs/if11045.pdf"}]},"originalContentHash":"fb20c0c16fff58b89f65685272c5f1df3c3fc009f922724471799fa733c8c275"},{"id":"short-agriculture-01","originalFile":"agriculture-food-reviewed.json","originalKey":"agri-maillard-versus-caramelization","change":"誤答3肢の「だけ」を取り除き、反応物から現象名を答える短問へ。","question":"還元糖とアミノ基の反応で食品が褐色になるのは？","choices":["メイラード反応","カラメル化","糊化","乳化"],"corre DCR — Periodontal (Gum) Disease","url":"https://www.nidcr.nih.gov/health-info/gum-disease"}]},"original":{"question":"歯肉の炎症に加え、歯を支える歯槽骨などの破壊が進む病態はどれか。","choices":["エナメル質だけの初期う蝕","歯髄の炎症だけ","歯周炎","歯の摩耗だけ"],"correctIndex":2,"explanation":"歯周炎では歯を支える組織が破壊される。歯槽骨の喪失は歯肉だけに限局する炎症と区別する要素。","distractorRationales":["歯冠の脱灰と支持組織の破壊は別。","歯の内部の炎症に対象が限られる。","歯の支持組織に及ぶ炎症・破壊に対応する。","機械的な摩耗だけでは指定された病態を表さない。"],"sources":[{"title":"NIDCR — Periodontal (Gum) Disease","url":"https://www.nidcr.nih.gov/health-info/gum-disease"}]},"originalContentHash":"1cd0ee1d7edf4c1a2c4de0d79be7e8b1b9c902c321c98f42acb3c1791afd0498"},{"id":"short-humanities-01","originalFile":"humanities-economics-reviewed.json","originalKey":"10000000-0000-4000-8003-000000000092","change":"不正解の限定語を除去し、定義から経済用語を答える短問へ。","question":"物価全体が継続して上がる現象は？","choices":["デフレーション","円高","インフレーション","デノミネーション"],"correctIndex":2,"explanation":"インフレーションは、物価水準全体の継続的な上昇です。一商品の値上がりとは区別します。","distractorRationales":["物価水準全体が持続的に下がる現象です。","他の通貨に対する円の価値の上昇です。","物価全体の継続的な上昇を指します。","通貨の表示単位を変更することです。"],"sourceLocation":"ECB Price stability, Chapter 3：inflationとdeflationの定義。","domain":"人文社会科学","subdomain":"経済学","content":{"question":"物価全体が継続して上がる現象は？","choices":["デフレーション","円高","インフレーション","デノミネーション"],"correctIndex":2,"explanation":"インフレーションは、物価水準全体の継続的な上昇です。一商品の値上がりとは区別します。","distractorRationales":["物価水準全体が持続的に下がる現象です。","他の通貨に対する円の価値の上昇です。","物価全体の継続的な上昇を指します。","通貨の表示単位を変更することです。"],"sources":[{"title":"European Central Bank — Price stability: why is it important for you?","url":"https://www.ecb.europa.eu/home/pdf/students/booklet_en.pdf"}]},"original":{"question":"インフレーションという語が指すのは、通常どのような変化か。","choices":["ある一商品の値上がりだけ","一般的な物価水準の継続的な上昇","自国通貨の為替相場の上昇だけ","実質生産量の増加だけ"],"correctIndex":1,"explanation":"インフレーションは広い範囲の財・サービスの一般的な物価水準が上昇することをいう。特定商品の値上がりだけや、生産量の増加だけとは区別する。","distractorRationales":["個別価格だけでは一般物価の上昇を示さない。","広範な価格水準の上昇に対応する。","為替相場と国内物価は別の指標。","価格の変化と生産量の変化を混同している。"],"sources":[{"title":"European Central Bank — Price stability: why is it important for you?","url":"https://www.ecb.europa.eu/home/pdf/students/booklet_en.pdf"}]},"originalContentHash":"32e859bba4f9d49f5df13fea42bf232568a30bb03089b49f7568acf66b4db398"},{"id":"short-math-02","originalFile":"math-scope-completion-reviewed.json","originalKey":"10000000-0000-4000-8005-000000000104","change":"外積の条件を保持して圧縮し、誤答の必ずを削除。","question":"一次独立な3次元ベクトルa,bの外積a×bは？","choices":["両方に垂直","aと平行","bと平行","ゼロベクトル"],"correctIndex":0,"explanation":"外積はaにもbにも垂直です。一次独立なので、ゼロベクトルにはなりません。","distractorRationales":["外積の直交性に対応します。","aと直交する非零ベクトルなので、aとは平行になりません。","bと直交する非零ベクトルなので、bとは平行になりません。","大きさは|a||b|sinθで、一次独立なときは0ではありません。"],"sourceLocation":"OpenStax Calculus Volume 3 §2.4：外積の両ベクトルへの直交性と大きさ。通常の3次元ユークリッド空間での外積。","domain":"数学","subdomain":"線形代数","content":{"question":"一次独立な3次元ベクトルa,bの外積a×bは？","choices":["両方に垂直","aと平行","bと平行","ゼロベクトル"],"correctIndex":0,"explanation":"外積はaにもbにも垂直です。一次独立なので、ゼロベクトルにはなりません。","distractorRationales":["外積の直交性に対応します。","aと直交する非零ベクトルなので、aとは平行になりません。","bと直交する非零ベクトルなので、bとは平行になりません。","大きさは|a||b|sinθで、一次独立なときは0ではありません。"],"sources":[{"title":"OpenStax — Calculus Volume 3 §2.4 The Cross Product","url":"https://openstax.org/books/calculus-volume-3/pages/2-4-the-cross-product"}]},"original":{"question":"向きと通常の内積を備えた3次元ユークリッド空間で、aとbは一次独立なベクトルとする。外積a×bについて正しいものはどれか。","choices":["aにもbにも垂直な非零ベクトルである","内積a·bと同じスカラーである","必ず零ベクトルである","必ずaと平行な非零ベクトルである"],"correctIndex":0,"explanation":"外積は両方のベクトルと直交する。大きさは|a||b|sinθで、aとbが一次独立ならθは0でもπでもないので、外積は非零になる。","distractorRationales":["直交性と、一次独立である場合の非零性を合わせた性質。","内積はスカラー、外積はベクトルである。","一次独立という条件により、外積は非零。","aと直交する非零ベクトルなので、aと平行にはならない。"],"sources":[{"title":"OpenStax — Calculus Volume 3 §2.4 The Cross Product","url":"https://openstax.org/books/calculus-volume-3/pages/2-4-the-cross-product"}]},"originalContentHash":"b5ba62db919041b4224eca7548e29b0b0689c59277435dede8d8418f53aeec82"},{"id":"short-physics-02","originalFile":"physics-classical-reviewed.json","originalKey":"10000000-0000-4000-8007-000000000366","change":"直列回路の電流比較から、合成抵抗を求める一段計算へ。測る内容が変わるため新しい難度が必要。","question":"2Ωと4Ωを直列接続。合成抵抗は？","choices":["4/3Ω","2Ω","4Ω","6Ω"],"correctIndex":3,"explanation":"直列接続の合成抵抗は足し算で、2+4=6Ωです。並列接続とは計算が異なります。","distractorRationales":["2Ωと4Ωを並列接続した場合の値です。","小さい方の抵抗を選ぶ計算ではありません。","大きい方の抵抗を選ぶ計算ではありません。","直列接続では各抵抗を足します。"],"sourceLocation":"OpenStax University Physics Volume 2 §10.2：直列抵抗の和と並列抵抗の逆数和。","domain":"物理","subdomain":"電磁気学","content":{"question":"2Ωと4Ωを直列接続。合成抵抗は？","choices":["4/3Ω","2Ω","4Ω","6Ω"],"correctIndex":3,"explanation":"直列接続の合成抵抗は足し算で、2+4=6Ωです。並列接続とは計算が異なります。","distractorRationales":["2Ωと4Ωを並列接続した場合の値です。","小さい方の抵抗を選ぶ計算ではありません。","大きい方の抵抗を選ぶ計算ではありません。","直列接続では各抵抗を足します。"],"sources":[{"title":"OpenStax — University Physics Volume 2, §10.2 Resistors in Series and Parallel","url":"https://openstax.org/books/university-physics-volume-2/pages/10-2-resistors-in-series-and-parallel"}]},"original":{"question":"抵抗2 Ωと4 Ωが、枝分かれのない直流回路に直列につながれている。定常状態でそれぞれに流れる電流について正しいのはどれか。","choices":["2 Ωの抵抗の電流が2倍","4 Ωの抵抗の電流が2倍","両方に同じ電流が流れる","片方にだけ電流が流れる"],"correctIndex":2,"explanation":"枝分かれのない定常回路では電荷が途中に蓄積し続けないため、直列の各抵抗を同じ電流が流れる。","distractorRationales":["同じ電圧を別々に加えた並列の比較とは条件が異なる。","抵抗の比だけから直列の電流を変えることはできない。","直列接続では各素子の電流が等しい。","定常状態の閉回路で片方だけに電流が流れることはない。"],"sources":[{"title":"OpenStax — University Physics Volume 2, §10.2 Resistors in Series and Parallel","url":"https://openstax.org/books/university-physics-volume-2/pages/10-2-resistors-in-series-and-parallel"}]},"originalContentHash":"aae9bafd50aaac164d00b64739152e095527ffacde9a2f2865373256ab094abe"},{"id":"short-chemistry-02","originalFile":"chemistry-organic-reviewed.json","originalKey":"10000000-0000-4000-8006-000000000025","change":"本人提示のS_N2問題。条件を短くし、誤答3肢の必ずを除去。Nは下付き、2は基線で表示。","question":"典型的なS_N2反応後、反応炭素の立体配置は？","choices":["保持される","反転する","平面になる","ラセミ化する"],"correctIndex":1,"explanation":"求核剤が脱離基の反対側から近づき、配置が反転します。R/S記号が逆になるという意味とは区別します。","distractorRationales":["典型的なS_N2反応は配置の反転を伴います。","背面攻撃による幾何学的な配置の反転です。","遷移状態と生成物の構造を区別します。","典型的なS_N2は両側から同程度に反応する機構ではありません。"],"sourceLocation":"McMurry / OpenStax Organic Chemistry §11.2：一段階の背面攻撃、立体配置の反転、遷移状態。","domain":"化学","subdomain":"有機化学","content":{"question":"典型的なS_N2反応後、反応炭素の立体配置は？","choices":["保持される","反転する","平面になる","ラセミ化する"],"correctIndex":1,"explanation":"求核剤が脱離基の反対側から近づき、配置が反転します。R/S記号が逆になるという意味とは区別します。","distractorRationales":["典型的なS_N2反応は配置の反転を伴います。","背面攻撃による幾何学的な配置の反転です。","遷移状態と生成物の構造を区別します。","典型的なS_N2は両側から同程度に反応する機構ではありません。"],"sources":[{"title":"John McMurry / OpenStax — Organic Chemistry, The SN2 Reaction","url":"https://openstax.org/books/organic-chemistry/pages/11-2-the-sn2-reaction"}]},"original":{"question":"四面体型の反応炭素で、求核剤が脱離基の反対側から一段階で置換する典型的なS_N2反応の立体化学はどれか。","choices":["平面カルボカチオンが必ず蓄積する","立体配置が必ず保持される","反応炭素まわりの幾何学的な配置が反転する","求核剤は必ず脱離基と同じ側から結合する"],"correctIndex":2,"explanation":"典型的な炭素上のS_N2では、背面攻撃と脱離が一つの段階で起こり、ワルデン反転を生じる。反応で置換基の優先順位も変わり得るため、R/S記号が必ず逆になるという言い方はしない。","distractorRationales":["独立したカルボカチオン中間体を経る機構は、指定したS_N2機構ではない。","指定された一回の背面置換では幾何学的に反転する。","背面攻撃に伴うワルデン反転。","指定した背面攻撃と逆。"],"sources":[{"title":"John McMurry / OpenStax — Organic Chemistry, The SN2 Reaction","url":"https://openstax.org/books/organic-chemistry/pages/11-2-the-sn2-reaction"}]},"originalContentHash":"f4344a29edcb14254d0ee87166493f48b74889130494398aabeb2547f01318d4"},{"id":"short-biology-02","originalFile":"biology-molecular-reviewed.json","originalKey":"10000000-0000-4000-8007-000000000426","change":"発現調節の長い説明から、DNA→RNAという過程の識別へ。新しい初期難度で扱う。","question":"DNAの塩基配列を写してRNAを作る過程は？","choices":["翻訳","複製","転写","逆転写"],"correctIndex":2,"explanation":"DNAを鋳型にRNAを作る過程が転写です。RNAをもとにタンパク質を作る過程は翻訳です。","distractorRationales":["mRNAの情報をもとにタンパク質を合成する過程です。","DNAをもとにDNAを作る過程です。","DNAの配列をもとにRNAを合成します。","RNAを鋳型にDNAを作る過程です。"],"sources":[{"title":"NHGRI — Transcription","url":"https://www.genome.gov/genetics-glossary/Transcription"}],"sourceLocation":"NHGRI glossary Transcription, Definition：DNA配列のRNAコピーを作る過程。","domain":"生物","subdomain":"分子生物学","content":{"question":"DNAの塩基配列を写してRNAを作る過程は？","choices":["翻訳","複製","転写","逆転写"],"correctIndex":2,"explanation":"DNAを鋳型にRNAを作る過程が転写です。RNAをもとにタンパク質を作る過程は翻訳です。","distractorRationales":["mRNAの情報をもとにタンパク質を合成する過程です。","DNAをもとにDNAを作る過程です。","DNAの配列をもとにRNAを合成します。","RNAを鋳型にDNAを作る過程です。"],"sources":[{"title":"NHGRI — Transcription","url":"https://www.genome.gov/genetics-glossary/Transcription"}]},"original":{"question":"ほぼ同じゲノムを持つヒトの異なる種類の体細胞で、作られるRNAやタンパク質の種類・量が異なる主な理由はどれか。","choices":["分化すると、使わない遺伝子がすべてDNAから削除されるから","全遺伝子が全細胞で常に同じ最大速度で転写されるから","各細胞で遺伝暗号が必ず別の対応表に変わるから","遺伝子発現が細胞の種類や状態に応じて調節されるから"],"correctIndex":3,"explanation":"どの遺伝子を、いつ、どこで、どれだけ発現させるかは調節される。同じDNA配列を持っていても、発現するRNAやタンパク質の組み合わせは同じとは限らない。","distractorRationales":["通常の細胞分化を全不要遺伝子の削除で説明することはできない。","実際には発現量が調節される。","細胞の種類による発現差の通常の説明ではない。","異なる細胞の機能を支える発現調節の説明。"],"sources":[{"title":"NHGRI — Gene Expression","url":"https://www.genome.gov/genetics-glossary/Gene-Expression"}]},"originalContentHash":"69d38a3bdf81a044980ce2756d9aed164a1a5d3290579988f94dec02a75141f9"},{"id":"short-earth-02","originalFile":"earth-minerals-strata-reviewed.json","originalKey":"10000000-0000-4000-8005-000000000061","change":"特徴の組合せを読む問題から、用語の識別へ。示相化石との混同を主な誤概念とする。","question":"地層の時代の対比に用いる化石を何と呼ぶ？","choices":["示準化石","示相化石","生痕化石","生きた化石"],"correctIndex":0,"explanation":"示準化石は、地層の時代を比べる手掛かりです。環境の推定に用いる示相化石と区別します。","distractorRationales":["地層の時代の対比に用いる化石の呼び名です。","主に地層ができた環境の推定に用います。","足跡や巣穴など、生物の活動の痕跡です。","現生の生物について使われる呼称で、年代対比の役割を表す名称ではありません。"],"sourceLocation":"Smithsonian Dating, Biostratigraphy/Biochronology, and Index Fossils：限定された時代と広い分布、離れた地層の年代対比。USGSの取得は今回公式検索索引まで。","domain":"地学","subdomain":"地質・堆積・年代","content":{"question":"地層の時代の対比に用いる化石を何と呼ぶ？","choices":["示準化石","示相化石","生痕化石","生きた化石"],"correctIndex":0,"explanation":"示準化石は、地層の時代を比べる手掛かりです。環境の推定に用いる示相化石と区別します。","distractorRationales":["地層の時代の対比に用いる化石の呼び名です。","主に地層ができた環境の推定に用います。","足跡や巣穴など、生物の活動の痕跡です。","現生の生物について使われる呼称で、年代対比の役割を表す名称ではありません。"],"sources":[{"title":"USGS — Geologic Time: Index Fossils","url":"https://pubs.usgs.gov/gip/geotime/fossils.html"},{"title":"Smithsonian Human Origins Program — Dating: Index Fossils","url":"https://humanorigins.si.edu/evidence/dating"}]},"original":{"question":"離れた地域の地層の時代を比べる示準化石として、一般に適する生物の特徴はどれか。","choices":["生存期間が長く、狭い地域にだけ分布する","生存期間が短く、広い地域に分布する","生存期間が長く、広い地域に分布する","生存期間が短く、狭い地域にだけ分布する"],"correctIndex":1,"explanation":"出現から消滅までが短く広く分布する生物の化石は、離れた地層の時代を絞りやすい。化石の産出位置や、別の地層からの再堆積でないかも確認する。","distractorRationales":["時代を絞りにくく、離れた地域の対比にも使いにくい。","時代の限定と地域間の対比に向く。","広域対比はできても、長い生存期間のため時代を細かく絞りにくい。","時代は絞りやすいが、離れた地域間の対比には分布が限られる。"],"sources":[{"title":"USGS — Geologic Time: Index Fossils","url":"https://pubs.usgs.gov/gip/geotime/fossils.html"},{"title":"Smithsonian Human Origins Program — Dating: Index Fossils","url":"https://humanorigins.si.edu/evidence/dating"}]},"originalContentHash":"9b81e696a5c796880946417702db9eab877fc1a7c8ce711f46cda7c76f645581"},{"id":"short-engineering-02","originalFile":"engineering-process-reviewed.json","originalKey":"10000000-0000-4000-8004-000000000147","change":"殺菌・ろ過などの長い誤答を、供給する気体の4択へ変更。","question":"活性汚泥法の曝気で、好気性微生物に供給する気体は？","choices":["窒素","メタン","水素","酸素"],"correctIndex":3,"explanation":"曝気で酸素を供給し、好気性の微生物による有機物の分解を支えます。","distractorRationales":["空気には多く含まれますが、設問の処理で供給する目的となる気体は酸素です。","嫌気性の消化などで生じる気体で、この曝気の目的ではありません。","好気性微生物の呼吸を支えるための供給気体ではありません。","活性汚泥法の好気的な処理を支えます。"],"sourceLocation":"EPA Primer for Municipal Wastewater Treatment Systems, PDF p.13：activated sludgeへの酸素供給とaeration。","domain":"工学","subdomain":"化学・バイオ・微細加工","content":{"question":"活性汚泥法の曝気で、好気性微生物に供給する気体は？","choices":["窒素","メタン","水素","酸素"],"correctIndex":3,"explanation":"曝気で酸素を供給し、好気性の微生物による有機物の分解を支えます。","distractorRationales":["空気には多く含まれますが、設問の処理で供給する目的となる気体は酸素です。","嫌気性の消化などで生じる気体で、この曝気の目的ではありません。","好気性微生物の呼吸を支えるための供給気体ではありません。","活性汚泥法の好気的な処理を支えます。"],"sources":[{"title":"US EPA — Primer for Municipal Wastewater Treatment Systems","url":"https://www.epa.gov/sites/default/files/2015-09/documents/primer.pdf"}]},"original":{"question":"通常の活性汚泥法で、生分解可能な有機物を取り除くために曝気する主な理由はどれか。","choices":["微生物を全て殺して有機物の分解を止めるため","溶存酸素を除き、メタン生成だけを促すため","全ての溶存有機物を、微生物を介さず気泡のろ過だけで除くため","好気的に働く微生物へ酸素を供給し、有機物の分解を支えるため"],"correctIndex":3,"explanation":"活性汚泥法では微生物を含む水を曝気・混合し、好気的な生物処理を進める。増えた微生物の一部は沈降分離して返送する。曝気だけで全ての汚染物質が除去されるわけではない。","distractorRationales":["活性汚泥は微生物の働きを利用する処理。","通常の曝気槽は酸素を供給する。嫌気性のメタン生成とは条件が異なる。","主に微生物の代謝を利用し、気泡の物理的ろ過だけで溶存有機物を除く方式ではない。","有機物を分解する微生物の働きに必要な酸素を供給する。"],"sources":[{"title":"US EPA — Primer for Municipal Wastewater Treatment Systems","url":"https://www.epa.gov/sites/default/files/2015-09/documents/primer.pdf"}]},"originalContentHash":"f4562b9f566ac54be364422233660d3f978115cb72aa391d4de7e4f6b667907c"},{"id":"short-agriculture-02","originalFile":"agriculture-forestry-reviewed.json","originalKey":"agri-coppice-asexual-regeneration","change":"生殖方式の長文比較から、森林更新の手法名を答える短問へ。","question":"切株から伸びる芽を利用して森林を再生する方法は？","choices":["播種更新","萌芽更新","植栽","天然下種更新"],"correctIndex":1,"explanation":"萌芽更新は、切株などから新しい芽が伸びる力を利用します。種子から育つ更新とは異なります。","distractorRationales":["種子をまいて更新する方法です。","残った個体の組織から伸びる芽を利用します。","苗木を植える方法です。","自然に散布された種子などから次の世代を育てます。"],"sourceLocation":"FAO AGROVOC coppice system, Definition：伐採後の切株からの萌芽による無性の更新。","domain":"農学","subdomain":"林学・草地・生態","content":{"question":"切株から伸びる芽を利用して森林を再生する方法は？","choices":["播種更新","萌芽更新","植栽","天然下種更新"],"correctIndex":1,"explanation":"萌芽更新は、切株などから新しい芽が伸びる力を利用します。種子から育つ更新とは異なります。","distractorRationales":["種子をまいて更新する方法です。","残った個体の組織から伸びる芽を利用します。","苗木を植える方法です。","自然に散布された種子などから次の世代を育てます。"],"sources":[{"title":"FAO AGROVOC — Coppice system","url":"https://agrovoc.review.fao.org/browse/agrovoc/en/page/c_1871"}]},"original":{"question":"萌芽更新では、伐採後に残った切株などから伸びる芽を利用する。この再生産を、種子からの更新と比べた特徴はどれか。","choices":["受粉・受精を経て新個体を作る有性生殖が基本","残った個体の組織から再生する無性生殖が基本","別の樹種からの受粉だけを必要とする","新しい根ができるため必ず遺伝的に異なる個体になる"],"correctIndex":1,"explanation":"切株などの生きた組織から芽が伸びるので、萌芽による更新は無性生殖を利用する。萌芽する能力は樹種や個体の状態によって異なる。","distractorRationales":["種子を経る有性生殖と混同している。","既存個体の組織を利用する無性生殖。","異種の受粉を必要とする仕組みではない。","根や芽の形成だけで必ず別の遺伝子型になるわけではない。"],"sources":[{"title":"FAO AGROVOC — Coppice system","url":"https://agrovoc.review.fao.org/browse/agrovoc/en/page/c_1871"}]},"originalContentHash":"3337052eccf5988957dc18bf39f2bde770d9bf92f8ce7e400184c6022f869835"},{"id":"short-informatics-02","originalFile":"informatics-database-reviewed.json","originalKey":"info-sql-order-guarantee","change":"行順の保証についての長い誤答から、目的に合うSQL句の識別へ。","question":"SQLで、結果の行を指定した順に並べる句は？","choices":["GROUP BY","HAVING","ORDER BY","WHERE"],"correctIndex":2,"explanation":"ORDER BYで、列や式を基準とする並び順を指定します。同順位を区別したいときは追加の並べ替え条件も指定します。","distractorRationales":["行をグループにまとめるための句です。","グループに対する抽出条件を指定します。","結果の並べ替え条件を指定する句です。","行の抽出条件を指定する句です。"],"sourceLocation":"PostgreSQL 18 §7.5 Sorting Rows (ORDER BY)：明示的な並べ替え指定と、指定しない場合の順序非保証。","domain":"情報・計算機科学","subdomain":"データベース","content":{"question":"SQLで、結果の行を指定した順に並べる句は？","choices":["GROUP BY","HAVING","ORDER BY","WHERE"],"correctIndex":2,"explanation":"ORDER BYで、列や式を基準とする並び順を指定します。同順位を区別したいときは追加の並べ替え条件も指定します。","distractorRationales":["行をグループにまとめるための句です。","グループに対する抽出条件を指定します。","結果の並べ替え条件を指定する句です。","行の抽出条件を指定する句です。"],"sources":[{"title":"PostgreSQL 18 — Sorting Rows (ORDER BY)","url":"https://www.postgresql.org/docs/18/queries-order.html"}]},"original":{"question":"PostgreSQLで表に主キーと索引がある。ORDER BYを指定しないSELECTの結果の行順は、どう考えるべきか。","choices":["必ず主キーの昇順になる","必ずINSERTした順になる","索引がある場合だけ主キーの昇順が保証される","順序は保証されず、必要な並び順はORDER BYで指定する"],"correctIndex":3,"explanation":"ORDER BYがなければ、実行計画などによって返る順序は変わりうる。望む順序は明示する。同じ値が並ぶ場合に順序を完全に決めたいなら、一意な列などを追加の並び順に使う。","distractorRationales":["主キーがあるだけでは出力順の保証にならない。","保存・挿入順を問い合わせ結果の契約にしている。","索引の存在だけで並び順を保証できるわけではない。","SQLの結果順を明示する考え方。"],"sources":[{"title":"PostgreSQL 18 — Sorting Rows (ORDER BY)","url":"https://www.postgresql.org/docs/18/queries-order.html"}]},"originalContentHash":"a02f4bf2f96794068597cfd9cb07b22d9ed4be2785b6b0683e815a93532d8695"},{"id":"short-medical-02","originalFile":"medical-microbiology-reviewed.json","originalKey":"medical-microbiology-biofilm-matrix","change":"3つの「だけ」を含む説明文を関連する微生物学用語の4択へ。","question":"微生物が細胞外の基質に包まれた集団を何と呼ぶ？","choices":["バイオフィルム","莢膜","芽胞","プラスミド"],"correctIndex":0,"explanation":"バイオフィルムでは、微生物の集団が細胞外の高分子からなる基質に包まれています。","distractorRationales":["微生物の集団と細胞外基質の関係を表します。","個々の細胞の外側を覆う構造です。","一部の細菌が作る耐久性の高い構造です。","主な染色体とは別に複製できるDNAです。"],"sourceLocation":"OpenStax Microbiology §9.1 Biofilms：集団、細胞外高分子基質、水の流路の観察。","domain":"医歯薬学","subdomain":"微生物・感染症","content":{"question":"微生物が細胞外の基質に包まれた集団を何と呼ぶ？","choices":["バイオフィルム","莢膜","芽胞","プラスミド"],"correctIndex":0,"explanation":"バイオフィルムでは、微生物の集団が細胞外の高分子からなる基質に包まれています。","distractorRationales":["微生物の集団と細胞外基質の関係を表します。","個々の細胞の外側を覆う構造です。","一部の細菌が作る耐久性の高い構造です。","主な染色体とは別に複製できるDNAです。"],"sources":[{"title":"OpenStax — Microbiology, §9.1 Biofilm Structure","url":"https://openstax.org/books/microbiology/pages/9-1-how-microbes-grow"}]},"original":{"question":"バイオフィルムの特徴を表す記述はどれか。","choices":["微生物が細胞外の高分子の基質に包まれ、集団として存在する","微生物が互いに独立して液中を浮遊する状態だけを指す","一個の細菌を囲む莢膜だけを指す","食細胞が微生物を取り込んだ細胞内小胞だけを指す"],"correctIndex":0,"explanation":"バイオフィルムでは細胞外の高分子からなる基質が微生物の集団を支える。単独細胞の莢膜や浮遊状態とは区別する。","distractorRationales":["集団と細胞外基質の関係を表す。","これは浮遊性の状態の説明。","一個の細胞の被膜と集団の基質を混同している。","宿主の食細胞内の構造との混同。"],"sources":[{"title":"OpenStax — Microbiology, §9.1 Biofilm Structure","url":"https://openstax.org/books/microbiology/pages/9-1-how-microbes-grow"}]},"originalContentHash":"64148f536ded79ed3107c9c2b6415989bdbf4b0dc16cbe51c4be81a66134bb3b"},{"id":"short-humanities-02","originalFile":"humanities-language-reviewed.json","originalKey":"10000000-0000-4000-8004-000000000234","change":"長い説明と誤答の「だけ」を除去し、調査法名で答える短問へ。","question":"対象の暮らしに参加しながら観察する調査法は？","choices":["質問紙調査","実験法","文献調査","参与観察"],"correctIndex":3,"explanation":"参与観察では、対象の生活や活動に参加し、やり取りも経験しながら観察・記録します。","distractorRationales":["質問項目への回答を集める調査です。","条件を操作して、その影響を調べる方法です。","既存の文献や記録を調べる方法です。","参加と観察を組み合わせる調査法です。"],"sourceLocation":"OpenStax Introduction to Anthropology §2.4 Participant Observation：対象の活動への参加と観察。","domain":"人文社会科学","subdomain":"言語・文学・教育・文化","content":{"question":"対象の暮らしに参加しながら観察する調査法は？","choices":["質問紙調査","実験法","文献調査","参与観察"],"correctIndex":3,"explanation":"参与観察では、対象の生活や活動に参加し、やり取りも経験しながら観察・記録します。","distractorRationales":["質問項目への回答を集める調査です。","条件を操作して、その影響を調べる方法です。","既存の文献や記録を調べる方法です。","参加と観察を組み合わせる調査法です。"],"sources":[{"title":"OpenStax — Introduction to Anthropology, 2.4 Participant Observation and Interviewing","url":"https://openstax.org/books/introduction-anthropology/pages/2-4-participant-observation-and-interviewing"}]},"original":{"question":"文化人類学の参与観察は、どのような調査方法か。","choices":["既存の人口統計表だけを再集計する","対象となる生活や活動に参加しながら観察し、その記録を残す","実験室だけで独立変数を操作する","対象者と関わらず、辞書の語義だけを比較する"],"correctIndex":1,"explanation":"参与観察では、活動に参加する経験と、観察・記録を組み合わせる。参加した経験を無批判に真実とみなすのではなく、研究者自身の立場や倫理への配慮も必要である。","distractorRationales":["二次的な統計分析であり、活動への参加は含まれない。","参加と観察・記録を組み合わせる方法。","統制実験と参与観察は異なる調査方法。","活動への参加を含まない。"],"sources":[{"title":"OpenStax — Introduction to Anthropology, 2.4 Participant Observation and Interviewing","url":"https://openstax.org/books/introduction-anthropology/pages/2-4-participant-observation-and-interviewing"}]},"originalContentHash":"9ee7b5c58eb3678189dd264a722063f19ab3ca2c0f6ee1db858ba82f1ef3b248"}]};
const key = 'science-short-pilot:'+PILOT.version;
const escapeHtml = s => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const scienceText = s => escapeHtml(s).replace(/S_N([12])/g,'S<sub>N</sub>$1');
const fresh = () => ({index:0,answers:{},orders:{},instant:false,overall:{},note:''});
let state=fresh(), selected=null, shownAt=performance.now();
try{const saved=JSON.parse(localStorage.getItem(key)||'null');if(saved&&saved.index>=0&&saved.index<=20&&saved.answers&&saved.orders&&saved.overall)state={...fresh(),...saved};}catch{}
function save(){try{localStorage.setItem(key,JSON.stringify(state));}catch{document.getElementById('storage-note').textContent='このブラウザでは保存できません。画面を閉じる前に感想をコピーしてください。';}}
function order(q){if(!state.orders[q.id]){const a=[0,1,2,3];for(let i=3;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}state.orders[q.id]=a;save();}return state.orders[q.id];}
function commit(index){const q=PILOT.items[state.index];if(!q||state.answers[q.id])return;state.answers[q.id]={selectedIndex:index,correct:index===q.content.correctIndex,elapsedMs:Math.round(performance.now()-shownAt),note:''};selected=null;save();render();document.getElementById('feedback')?.focus({preventScroll:true});}
function next(){const q=PILOT.items[state.index];if(q&&!state.answers[q.id])return;state.index=Math.min(20,state.index+1);selected=null;shownAt=performance.now();save();render();window.scrollTo({top:0});}
function feedbackText(){const answered=Object.keys(state.answers).length,correct=Object.values(state.answers).filter(a=>a.correct).length;return ['短問20問の感想（'+PILOT.version+'）',`回答 ${answered}/20、正解 ${correct}問`,'文量：'+(state.overall.length||'未回答'),'難しさ：'+(state.overall.difficulty||'未回答'),'テンポ：'+(state.overall.tempo||'未回答'),'全体のメモ：'+(state.note||'なし'),...PILOT.items.flatMap((q,i)=>state.answers[q.id]?.note?[`${i+1}問目（${q.domain}）：${state.answers[q.id].note}`]:[])].join('\n');}
function render(){const app=document.getElementById('app');if(state.index===20){app.innerHTML=`<section class="panel"><h2>20問、おつかれさまでした。</h2><p><strong>${Object.values(state.answers).filter(a=>a.correct).length} / 20問 正解</strong></p><p class="muted">この結果から実力スコアは計算しません。残り80問を作る目安に、解き心地を教えてください。</p>${[['length','文量',['短くてよい','ちょうどよい','まだ長い']],['difficulty','難しさ',['易しすぎる','ちょうどよい','まだ難しい']],['tempo','テンポ',['さくさく解けた','少し考える時間が必要','読む・考える負担が大きい']]].map(([name,label,options])=>`<fieldset><legend>${label}</legend>${options.map(value=>`<label><input type="radio" name="${name}" value="${value}" ${state.overall[name]===value?'checked':''}> ${value}</label>`).join('')}</fieldset>`).join('')}<label for="overall-note">気になった問題・残り80問への希望（任意）</label><textarea id="overall-note">${escapeHtml(state.note)}</textarea><pre id="summary">${escapeHtml(feedbackText())}</pre><div class="actions"><button class="secondary" id="review">回答を見直す</button><button class="primary" id="copy">感想をコピー</button><button class="secondary" id="download">感想を保存</button></div><p class="muted" id="copy-status" role="status">コピーした感想をチャットに貼り付けられます。自動送信はしません。</p></section>`;
app.querySelectorAll('input[type=radio]').forEach(el=>el.addEventListener('change',()=>{state.overall[el.name]=el.value;save();document.getElementById('summary').textContent=feedbackText();}));document.getElementById('overall-note').addEventListener('input',e=>{state.note=e.target.value;save();document.getElementById('summary').textContent=feedbackText();});document.getElementById('review').onclick=()=>{state.index=0;save();render();};document.getElementById('copy').onclick=async()=>{try{await navigator.clipboard.writeText(feedbackText());document.getElementById('copy-status').textContent='コピーしました。チャットに貼り付けてください。';}catch{document.getElementById('copy-status').textContent='コピーできませんでした。上の感想を選択してコピーするか、「感想を保存」を使ってください。';}};document.getElementById('download').onclick=()=>{const url=URL.createObjectURL(new Blob([feedbackText()],{type:'text/plain;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='短問20問の感想.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};return;}
const q=PILOT.items[state.index],a=state.answers[q.id],o=order(q);const n=Object.keys(state.answers).length;
app.innerHTML=`<section class="panel"><div class="top"><strong>${n} / 20問 回答済み</strong><span class="muted">正解 ${Object.values(state.answers).filter(a=>a.correct).length}問</span></div><progress value="${n}" max="20" aria-label="回答の進み具合"></progress></section><section class="panel"><div class="top"><span class="pill">第 ${state.index+1} 問　${escapeHtml(q.domain)}</span><span class="muted">${escapeHtml(q.subdomain)}</span></div><h2>${scienceText(q.content.question)}</h2><div class="choices">${o.map((original,i)=>`<button type="button" class="choice ${a?(original===q.content.correctIndex?'correct':original===a.selectedIndex?'wrong':''):selected===original?'selected':''}" data-index="${original}" ${a?'disabled':''} aria-pressed="${a?a.selectedIndex===original:selected===original}"><span class="num">${i+1}</span><span>${scienceText(q.content.choices[original])}${a&&original===q.content.correctIndex?' ✓':''}</span></button>`).join('')}</div><label><input type="checkbox" id="instant" ${state.instant?'checked':''}> キーボードの1,2,3,4で即回答</label><p class="muted">クリック・タップは即回答。数字キーは、チェックなしなら選択後にEnterで確定できます。</p>${!a?`<button class="primary" id="confirm" ${selected===null?'disabled':''}>この回答を確定する</button>`:`<div class="feedback" id="feedback" tabindex="-1"><h3>${a.correct?'正解！':'正解は「'+scienceText(q.content.choices[q.content.correctIndex])+'」'}</h3><p>${scienceText(q.content.explanation)}</p><details><summary>詳しい解説・出典</summary><ul>${o.map(i=>`<li><strong>${scienceText(q.content.choices[i])}</strong>：${scienceText(q.content.distractorRationales[i])}</li>`).join('')}</ul><ul>${q.content.sources.map(s=>`<li><a target="_blank" rel="noopener noreferrer" href="${escapeHtml(s.url)}">${escapeHtml(s.title)}</a></li>`).join('')}</ul></details><details><summary>この問題へのメモ（任意）</summary><textarea id="question-note" aria-label="この問題へのメモ" placeholder="長い、難しい、もっとこうしたい、など">${escapeHtml(a.note||'')}</textarea></details></div>`}<div class="actions"><button class="secondary" id="previous" ${state.index===0?'disabled':''}>前の問題</button>${a?`<button class="primary" id="next">${state.index===19?'20問の感想へ':'次の問題へ'} →</button>`:''}</div>${a?'<p class="muted">Spaceキーでも次へ進めます。</p>':''}</section>`;
app.querySelectorAll('.choice').forEach(el=>el.onclick=()=>commit(Number(el.dataset.index)));document.getElementById('instant').onchange=e=>{state.instant=e.target.checked;save();};document.getElementById('confirm')?.addEventListener('click',()=>{if(selected!==null)commit(selected);});document.getElementById('next')?.addEventListener('click',next);document.getElementById('previous').onclick=()=>{state.index=Math.max(0,state.index-1);selected=null;shownAt=performance.now();save();render();};document.getElementById('question-note')?.addEventListener('input',e=>{a.note=e.target.value;save();});}
document.addEventListener('keydown',e=>{if(e.repeat||e.metaKey||e.ctrlKey||e.altKey||e.shiftKey||e.isComposing)return;const t=e.target;if(t instanceof HTMLElement&&(t.matches('textarea,select,input:not([type="checkbox"]):not([type="radio"])')||t.isContentEditable))return;const q=PILOT.items[state.index];if(!q)return;if(e.key===' '&&state.answers[q.id]){if(t instanceof HTMLElement&&t.closest('button,a,input,summary'))return;e.preventDefault();next();return;}if(state.answers[q.id])return;if(/^[1-4]$/.test(e.key)){e.preventDefault();selected=order(q)[Number(e.key)-1];if(state.instant)commit(selected);else render();}else if(e.key==='Enter'&&selected!==null){e.preventDefault();commit(selected);}});
document.getElementById('reset').onclick=()=>{if(confirm('この試用の回答と感想を消します。よいですか？')){state=fresh();selected=null;shownAt=performance.now();save();render();window.scrollTo({top:0});}};
render();
</script></body></html>
