const issued=issue(),q=byId.get(issued.id),a=state.answers[q.id],o=order(q);
app.innerHTML=`<section class="panel"><div class="metrics"><div><strong>${answers().length} / 20問 回答済み</strong><progress value="${answers().length}" max="20"></progress><p>正解 ${progress.correctCount}問</p></div><div><strong>推定総合スコア</strong>${scoreHtml(progress)}</div></div></section><section class="panel"><div class="top"><span class="pill">第 ${state.index+1} 問　${escapeHtml(q.domain)}</span><span class="pill pill-level">レベル${q.provisionalLevel}（仮）</span></div><h2>${text(q.content.question)}</h2><div class="choices">${o.map((n,i)=>`<button type="button" class="choice ${a?(n===q.content.correctIndex?'correct':n===a.selectedIndex?'wrong':''):selected===n?'selected':''}" data-index="${n}" ${a?'disabled':''} aria-pressed="${a?a.selectedIndex===n:selected===n}"><span class="num">${i+1}</span><span>${text(q.content.choices[n])}${a&&n===q.content.correctIndex?' ✓':''}</span></button>`).join('')}</div><label><input type="checkbox" id="instant" ${state.instant?'checked':''}> キーボードの1,2,3,4で即回答</label><p class="muted">クリック・タップは即回答。数字キーは、チェックなしなら選択後にEnterで確定できます。</p>${!a?`<button class="primary" id="confirm" ${selected===null?'disabled':''}>この回答を確定する</button>`:`<div class="feedback" id="feedback" tabindex="-1"><h3>${a.selectedIndex===q.content.correctIndex?'正解！':'正解は「'+text(q.content.choices[q.content.correctIndex])+'」'}</h3><p>${text(q.content.explanation)}</p><details><summary>詳しい解説・出典</summary><ul>${o.map(i=>`<li><strong>${text(q.content.choices[i])}</strong>：${text(q.content.distractorRationales[i])}</li>`).join('')}</ul><ul>${q.content.sources.map(s=>`<li><a target="_blank" rel="noopener noreferrer" href="${escapeHtml(s.url)}">${escapeHtml(s.title)}</a></li>`).join('')}</ul></details><details><summary>この問題へのメモ</summary><textarea id="question-note">${escapeHtml(a.note||'')}</textarea></details></div>`}<details><summary>運営向け：今回の出題理由</summary><p>仮難度 ${q.difficulty70.toFixed(0)}、予測正答率 ${Math.round(issued.predicted*100)}％。</p><p>${selectionText(issued)}${issued.reason.includes('repeat-fallback')?'未見候補が足りず、再出題しています。':''}</p><p class="muted">前問とは分野が異なる場合があるため、表示レベルが毎問上がる仕組みではありません。</p></details><div class="actions"><button class="secondary" id="previous" ${state.index===0?'disabled':''}>前の問題</button>${a?`<button class="primary" id="next">${state.index===19?'結果を見る':'次の問題へ'} →</button>`:''}</div></section>`;
app.querySelectorAll('.choice').forEach(el=>el.onclick=()=>commit(Number(el.dataset.index)));document.getElementById('instant').onchange=e=>{state.instant=e.target.checked;save();};document.getElementById('confirm')?.addEventListener('click',()=>{if(selected!==null)commit(selected);});document.getElementById('next')?.addEventListener('click',next);document.getElementById('previous').onclick=()=>{state.index=Math.max(0,state.index-1);selected=null;shownAt=performance.now();save();render();};document.getElementById('question-note')?.addEventListener('input',e=>{a.note=e.target.value;save();});}
document.addEventListener('keydown',e=>{if(e.repeat||e.metaKey||e.ctrlKey||e.altKey||e.shiftKey||e.isComposing)return;const t=e.target;if(t instanceof HTMLElement&&(t.matches('textarea,select,input:not([type="checkbox"]):not([type="radio"])')||t.isContentEditable))return;const issued=state.issued[state.index];if(!issued||!state.started)return;const q=byId.get(issued.id);if(e.key===' '&&state.answers[q.id]){if(t instanceof HTMLElement&&t.closest('button,a,input,summary'))return;e.preventDefault();next();return;}if(state.answers[q.id])return;if(/^[1-4]$/.test(e.key)){e.preventDefault();selected=order(q)[Number(e.key)-1];if(state.instant)commit(selected);else render();}else if(e.key==='Enter'&&selected!==null){e.preventDefault();commit(selected);}});
render();
</script></body></html>
