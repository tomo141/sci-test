<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>実力に合わせた短問20問｜全分野科学検定</title><style>/*__STYLE__*/</style><style>.metrics{display:grid;grid-template-columns:1fr 1fr;gap:18px}.score{font-size:32px;font-weight:850;color:#1454cf}.detail-table{width:100%;border-collapse:collapse;font-size:14px}.detail-table td,.detail-table th{padding:7px;border-bottom:1px solid #dde5f0;text-align:left}.history{border-left:4px solid #aac2ee;padding-left:14px}.survey-field{margin:24px 0;border:0;padding:0}.survey-field legend{font-weight:700;margin-bottom:10px}.survey-choice{display:flex;align-items:center;gap:10px;min-height:44px;margin:6px 0;padding:8px 12px;border:1px solid #dde5f0;border-radius:10px}.pill-level{background:#fff5d5;color:#985900;border-color:#f3d27e}@media(max-width:600px){.metrics{gap:10px}.score{font-size:28px}.detail-table{font-size:12px}}</style></head><body><main>
<div class="brand">全分野科学検定</div><h1>実力に合わせた短問20問</h1><p>100問から、あなたの回答に合わせて選びます。10分野を2問ずつ。</p><p class="muted">問題のレベル・難度は仮設定です。スコアは本番と同じ計算方法による参考値で、本番の成績には入りません。回答はこのブラウザ内に保存します。</p><p id="storage-note" class="muted" role="status"></p><div id="app"></div><p class="muted"><a href="./">最初の固定20問に戻る</a> · <a href="balanced/REVIEW.md" target="_blank">100問の原稿・仮難度を見る</a></p>
</main><script>/*__LIBRARY__*/</script><script>
'use strict';
const BANK=/*__BANK__*/;
const key='science-short-adaptive:'+BANK.version+':'+BANK.hash;
const escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const text=s=>escapeHtml(s).replace(/S_N([12])/g,'S<sub>N</sub>$1').replace(/K_max/g,'K<sub>max</sub>');
const byId=new Map(BANK.items.map(q=>[q.id,q]));
let state={index:0,issued:[],answers:{},orders:{},instant:false,history:[],useHistory:true,started:false,completedTrials:[],note:'',survey:{difficulty:'',tempo:''},surveyHistory:[],selfAssessments:{},selectionPolicy:null},selected=null,shownAt=performance.now();
try{const saved=JSON.parse(localStorage.getItem(key)||'null');if(saved&&Array.isArray(saved.issued)&&saved.issued.every(i=>byId.has(i.id))&&saved.index>=0&&saved.index<=20&&saved.answers&&Array.isArray(saved.completedTrials))state={...state,...saved};}catch{}
// Keep persisted v1 attempts and their answers; only new starts use v2.
if(state.started&&!state.selectionPolicy)state.selectionPolicy=SciencePreview.LEGACY_TRIAL_POLICY;
let oldAnswers=[];
try{const old=JSON.parse(localStorage.getItem('science-short-pilot:short-pilot-v1-20260917')||'null');oldAnswers=BANK.pilotV1.flatMap(q=>Number.isInteger(old?.answers?.[q.id]?.selectedIndex)?[{id:q.id,correct:old.answers[q.id].selectedIndex===q.correctIndex}]:[]);}catch{}
function save(){try{localStorage.setItem(key,JSON.stringify(state));}catch{document.getElementById('storage-note').textContent='このブラウザでは保存できません。ページを閉じると回答が失われることがあります。';}}
function answers(){return state.issued.flatMap(q=>state.answers[q.id]?[{id:q.id,correct:state.answers[q.id].selectedIndex===byId.get(q.id).content.correctIndex}]:[]);}
function scoreHtml(progress,previous=false){const s=progress.score;return s?`<div class="score">${s.value}<span style="font-size:16px"> / 990</span></div><div>推定幅 ${s.low}〜${s.high}</div><p class="muted">${s.unmeasuredDomains?`未回答の${s.unmeasuredDomains}分野には仮推定を含みます。`:previous?'初回の回答だけから計算しています。':'今回の回答だけから計算しています。'} 問題の仮難度による参考値です。</p>`:'<div class="muted">最初の回答後に表示します。</div>';}
function order(q){if(!state.orders[q.id]){const a=[0,1,2,3];for(let i=3;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}state.orders[q.id]=a;save();}return state.orders[q.id];}
function start(){state.history=state.useHistory?[...oldAnswers,...state.completedTrials.flat()]:[];state.started=true;state.selectionPolicy=SciencePreview.TRIAL_POLICY;save();render();}
function issue(){if(state.issued[state.index])return state.issued[state.index];const next=SciencePreview.choose(BANK.items,answers(),state.history,Math.random,state.selectionPolicy);if(!next)throw new Error('利用できる問題がありません。');state.issued.push(next);save();return next;}
function commit(index){const issued=state.issued[state.index];if(!issued||state.answers[issued.id])return;state.answers[issued.id]={selectedIndex:index,elapsedMs:Math.round(performance.now()-shownAt),note:''};selected=null;save();render();document.getElementById('feedback')?.focus({preventScroll:true});}
function next(){const q=state.issued[state.index];if(!q||!state.answers[q.id])return;state.index++;selected=null;shownAt=performance.now();save();render();window.scrollTo({top:0});}
function report(){const p=SciencePreview.progress(BANK.items,answers());return ['適応出題の短問20問（'+BANK.version+'）',`回答 ${answers().length}/20、正解 ${p.correctCount}問`,p.score?`参考スコア ${p.score.value}/990、推定幅 ${p.score.low}〜${p.score.high}`:'スコア未算出',`過去の参考回答 ${state.history.length}問（今回の採点には不使用）`,`出題方式 ${state.selectionPolicy}`,...SciencePreview.experienceQuestions.map(q=>q.label+'：'+(state.survey[q.key]?SciencePreview.experienceLabel(q.key,state.survey[q.key]):'未回答')),'全体のメモ：'+state.note,...Object.values(state.selfAssessments).map(a=>'自己評価 '+SciencePreview.scopeLabel(a.scope)+'：'+(SciencePreview.knowledgeLevels(a.scope).find(l=>l.key===a.level)?.title??'まだ判断できない')),...state.issued.map((r,i)=>{const q=byId.get(r.id),a=state.answers[r.id];return `${i+1}問目 ${q.domain} レベル${q.provisionalLevel} 予測${Math.round(r.predicted*100)}％${r.target?' 目標'+Math.round(r.target.min*100)+'〜'+Math.round(r.target.max*100)+'％':''} ${a?(a.selectedIndex===q.content.correctIndex?'正解':'不正解'):'未回答'}${a?.note?'：'+a.note:''}`;})].join('\n');}
function selectionText(issued){
  const band=issued.target?Math.round(issued.target.min*100)+'〜'+Math.round(issued.target.max*100):'75〜85';
  return '目標 '+band+'％。'+(issued.reason.includes('easier-probability-fallback')?'範囲内の候補がなく、易しい側から選びました。':issued.reason.includes('nearest-probability-fallback')?'範囲内の候補がなく、利用できる中で近い問題を選びました。':'目標範囲内から選びました。');
}
const selfAssessmentMarkup='<details id="self-assessment"><summary>分野ごとの自己評価（任意）</summary><div id="self-fields"></div></details>';
let selfScope=null;
function renderSelfAssessment(){
  const root=document.getElementById('self-fields');if(!root)return;
  const scopes=new Map();for(const issued of state.issued){const q=byId.get(issued.id);scopes.set(q.domain,{domain:q.domain,subdomain:null});if(q.subdomain)scopes.set(q.domain+'::'+q.subdomain,{domain:q.domain,subdomain:q.subdomain});}
  const all=[...scopes.values()],domains=[...new Set(all.map(s=>s.domain))];
  if(!selfScope||!all.some(s=>s.domain===selfScope.domain&&s.subdomain===selfScope.subdomain))selfScope=all[0];
  if(!selfScope)return;
  const key=selfScope.domain+'::'+(selfScope.subdomain??''),saved=state.selfAssessments[key];
  root.innerHTML=`<p>1分野ずつ、今の感覚で教えてください。学歴の申告ではなく、今回のスコアにも影響しません。</p>
    <fieldset class="survey-field"><legend>大分野を選ぶ</legend>${domains.map(d=>`<label class="survey-choice"><input type="radio" name="self-domain" value="${escapeHtml(d)}" ${selfScope.domain===d?'checked':''}>${escapeHtml(d)}</label>`).join('')}</fieldset>
    <fieldset class="survey-field"><legend>今回答える範囲</legend>${all.filter(s=>s.domain===selfScope.domain).map(s=>`<label class="survey-choice"><input type="radio" name="self-scope" value="${escapeHtml(s.subdomain??'')}" ${selfScope.subdomain===s.subdomain?'checked':''}>${escapeHtml(SciencePreview.scopeLabel(s))}</label>`).join('')}</fieldset>
    <fieldset class="survey-field"><legend>${escapeHtml(SciencePreview.scopeLabel(selfScope))}</legend><p>それぞれのグループが約70％正解できる問題を想像してください。あなた自身も、10問中7問くらい解けそうなのはどのグループですか？</p>${SciencePreview.knowledgeLevels(selfScope).map(l=>`<label class="survey-choice"><input type="radio" name="self-level" value="${l.key}" ${saved?.level===l.key?'checked':''}><span><strong>${escapeHtml(l.title)}</strong><br>${escapeHtml(l.description)}</span></label>`).join('')}<label class="survey-choice"><input type="radio" name="self-level" value="unknown" ${saved&&saved.level===null?'checked':''}>まだ判断できない</label></fieldset>
    <p id="self-status" role="status" class="muted">${saved?'このブラウザに回答を保存しています。':'大分野・小分野は別々に記録します。回答は任意です。'}</p>`;
  root.querySelectorAll('[name="self-domain"]').forEach(input=>input.onchange=()=>{selfScope={domain:input.value,subdomain:null};renderSelfAssessment();});
  root.querySelectorAll('[name="self-scope"]').forEach(input=>input.onchange=()=>{selfScope={...selfScope,subdomain:input.value||null};renderSelfAssessment();});
  root.querySelectorAll('[name="self-level"]').forEach(input=>input.onchange=()=>{state.selfAssessments[key]={scope:{...selfScope},level:input.value==='unknown'?null:input.value,version:SciencePreview.KNOWLEDGE_LEVEL_VERSION,recordedAt:new Date().toISOString()};save();document.getElementById('self-status').textContent='このブラウザに回答を保存しました。';});
}
function render(){const app=document.getElementById('app');
if(!state.started){app.innerHTML=`<section class="panel"><h2>正解状況に合わせて、難度を調整</h2><p>予測正答率75〜85％の短問から始めます。今回の正答率が目標の80％より低ければ易しく、高ければ難しくなるよう調整します。未見問題を優先し、その範囲に候補がないときは易しい側を先に探します。</p><label><input type="checkbox" id="use-history" ${state.useHistory?'checked':''}> このブラウザの過去の試用回答を、出題の参考にする</label><p class="muted">参考にできる回答：${oldAnswers.length+state.completedTrials.flat().length}問。今回の点数には混ぜません。</p>${oldAnswers.length?`<details class="history"><summary>最初の20問を仮難度で計算した参考スコア</summary>${scoreHtml(SciencePreview.progress(BANK.items,oldAnswers),true)}<p class="muted">解いた後に仮難度を設定した参考計算です。難度の実測・上位者の精度検証は未完了です。</p></details>`:''}<div class="actions"><button class="primary" id="start">20問を始める</button></div></section>`;document.getElementById('use-history').onchange=e=>{state.useHistory=e.target.checked;save();};document.getElementById('start').onclick=start;return;}
const progress=SciencePreview.progress(BANK.items,answers());
if(state.index===20){app.innerHTML=`<section class="panel"><h2>20問、おつかれさまでした。</h2><p><strong>${progress.correctCount} / 20問 正解</strong></p>${scoreHtml(progress)}<details><summary>分野ごとの参考スコア</summary><table class="detail-table"><tr><th>分野</th><th>点数 / 99</th><th>推定幅</th></tr>${Object.entries(progress.domains).map(([d,v])=>`<tr><td>${escapeHtml(d)}</td><td>${v.score}</td><td>${v.low}〜${v.high}</td></tr>`).join('')}</table></details><details><summary>出題されたレベルと予測正答率</summary><pre>${escapeHtml(report())}</pre></details><h3>解いてみて、どうでしたか？</h3><p class="muted">アンケートへの協力は任意です。</p>${SciencePreview.experienceQuestions.map(q=>`<fieldset class="survey-field"><legend>${escapeHtml(q.label)}</legend>${q.choices.map(([v,l])=>`<label class="survey-choice"><input type="radio" name="survey-${q.key}" value="${v}" ${state.survey[q.key]===v?'checked':''}>${escapeHtml(l)}</label>`).join('')}</fieldset>`).join('')}<label for="note">ひとこと（任意）</label><textarea id="note" maxlength="2000">${escapeHtml(state.note)}</textarea>${selfAssessmentMarkup}<div class="actions"><button class="secondary" id="review">回答を見直す</button><button class="primary" id="copy">感想と結果をコピー</button><button class="secondary" id="again">この回答を履歴にしてもう20問</button></div><p id="copy-status" class="muted" role="status">本番への送信・保存は行いません。</p></section>`;document.querySelectorAll('[name^="survey-"]').forEach(input=>{input.onchange=()=>{state.survey[input.name.slice(7)]=input.value;save();};});renderSelfAssessment();document.getElementById('note').oninput=e=>{state.note=e.target.value;save();};document.getElementById('review').onclick=()=>{state.index=0;save();render();};document.getElementById('copy').onclick=async()=>{try{await navigator.clipboard.writeText(report());document.getElementById('copy-status').textContent='コピーしました。チャットに貼り付けられます。';}catch{document.getElementById('copy-status').textContent='コピーできませんでした。出題されたレベルの欄から結果を選択してコピーできます。';}};document.getElementById('again').onclick=()=>{state.completedTrials.push(answers());state.surveyHistory.push({recordedAt:new Date().toISOString(),response:{...state.survey,comment:state.note},issued:state.issued.map(q=>q.id),selectionPolicy:state.selectionPolicy,selfAssessments:structuredClone(state.selfAssessments)});state={...state,index:0,issued:[],answers:{},orders:{},history:[],started:false,selectionPolicy:null,note:'',survey:{difficulty:'',tempo:''}};selected=null;save();render();window.scrollTo({top:0});};return;}
const issued=issue(),q=byId.get(issued.id),a=state.answers[q.id],o=order(q);
app.innerHTML=`<section class="panel"><div class="metrics"><div><strong>${answers().length} / 20問 回答済み</strong><progress value="${answers().length}" max="20"></progress><p>正解 ${progress.correctCount}問</p></div><div><strong>推定総合スコア</strong>${scoreHtml(progress)}</div></div></section><section class="panel"><div class="top"><span class="pill">第 ${state.index+1} 問　${escapeHtml(q.domain)}</span><span class="pill pill-level">レベル${q.provisionalLevel}（仮）</span></div><h2>${text(q.content.question)}</h2><div class="choices">${o.map((n,i)=>`<button type="button" class="choice ${a?(n===q.content.correctIndex?'correct':n===a.selectedIndex?'wrong':''):selected===n?'selected':''}" data-index="${n}" ${a?'disabled':''} aria-pressed="${a?a.selectedIndex===n:selected===n}"><span class="num">${i+1}</span><span>${text(q.content.choices[n])}${a&&n===q.content.correctIndex?' ✓':''}</span></button>`).join('')}</div><label><input type="checkbox" id="instant" ${state.instant?'checked':''}> キーボードの1,2,3,4で即回答</label><p class="muted">クリック・タップは即回答。数字キーは、チェックなしなら選択後にEnterで確定できます。</p>${!a?`<button class="primary" id="confirm" ${selected===null?'disabled':''}>この回答を確定する</button>`:`<div class="feedback" id="feedback" tabindex="-1"><h3>${a.selectedIndex===q.content.correctIndex?'正解！':'正解は「'+text(q.content.choices[q.content.correctIndex])+'」'}</h3><p>${text(q.content.explanation)}</p><details><summary>詳しい解説・出典</summary><ul>${o.map(i=>`<li><strong>${text(q.content.choices[i])}</strong>：${text(q.content.distractorRationales[i])}</li>`).join('')}</ul><ul>${q.content.sources.map(s=>`<li><a target="_blank" rel="noopener noreferrer" href="${escapeHtml(s.url)}">${escapeHtml(s.title)}</a></li>`).join('')}</ul></details><details><summary>この問題へのメモ</summary><textarea id="question-note">${escapeHtml(a.note||'')}</textarea></details></div>`}<details><summary>運営向け：今回の出題理由</summary><p>仮難度 ${q.difficulty70.toFixed(0)}、予測正答率 ${Math.round(issued.predicted*100)}％。</p><p>${selectionText(issued)}${issued.reason.includes('repeat-fallback')?'未見候補が足りず、再出題しています。':''}</p><p class="muted">前問とは分野が異なる場合があるため、表示レベルが毎問上がる仕組みではありません。</p></details><div class="actions"><button class="secondary" id="previous" ${state.index===0?'disabled':''}>前の問題</button>${a?`<button class="primary" id="next">${state.index===19?'結果を見る':'次の問題へ'} →</button>`:''}</div></section>`;
app.querySelectorAll('.choice').forEach(el=>el.onclick=()=>commit(Number(el.dataset.index)));document.getElementById('instant').onchange=e=>{state.instant=e.target.checked;save();};document.getElementById('confirm')?.addEventListener('click',()=>{if(selected!==null)commit(selected);});document.getElementById('next')?.addEventListener('click',next);document.getElementById('previous').onclick=()=>{state.index=Math.max(0,state.index-1);selected=null;shownAt=performance.now();save();render();};document.getElementById('question-note')?.addEventListener('input',e=>{a.note=e.target.value;save();});}
document.addEventListener('keydown',e=>{if(e.repeat||e.metaKey||e.ctrlKey||e.altKey||e.shiftKey||e.isComposing)return;const t=e.target;if(t instanceof HTMLElement&&(t.matches('textarea,select,input:not([type="checkbox"]):not([type="radio"])')||t.isContentEditable))return;const issued=state.issued[state.index];if(!issued||!state.started)return;const q=byId.get(issued.id);if(e.key===' '&&state.answers[q.id]){if(t instanceof HTMLElement&&t.closest('button,a,input,summary'))return;e.preventDefault();next();return;}if(state.answers[q.id])return;if(/^[1-4]$/.test(e.key)){e.preventDefault();selected=order(q)[Number(e.key)-1];if(state.instant)commit(selected);else render();}else if(e.key==='Enter'&&selected!==null){e.preventDefault();commit(selected);}});
render();
</script></body></html>
